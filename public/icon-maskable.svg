<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12" />
      <stop offset="50%" stop-color="#050608" />
      <stop offset="100%" stop-color="#020304" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7b2c" />
      <stop offset="35%" stop-color="#dfb141" />
      <stop offset="50%" stop-color="#fff1a8" />
      <stop offset="65%" stop-color="#e5b842" />
      <stop offset="100%" stop-color="#9a7b2c" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable safe zones -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" opacity="0.1" />

  <!-- Scaled down to safe inner 75% zone -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Base Tier -->
    <polygon points="256,70 120,380 176,380 256,180 336,380 392,380" fill="url(#goldGrad)" />
    <!-- Core Blade -->
    <polygon points="256,110 190,390 256,340 322,390" fill="#0d0f17" stroke="url(#goldGrad)" stroke-width="6" />
    <!-- Heart Pillar -->
    <polygon points="256,140 236,320 256,300 276,320" fill="url(#amberGrad)" />
    <!-- Apex Star Spark -->
    <polygon points="256,40 262,60 282,66 262,72 256,92 250,72 230,66 250,60" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
